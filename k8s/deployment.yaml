apiVersion: apps/v1
kind: Deployment
metadata:
  name: minishop
  namespace: minishop
  labels:
    app.kubernetes.io/name: minishop
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: minishop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minishop
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: minishop
          # Build and push your image first (see k8s/README.md), then set its name here.
          image: ghcr.io/dialarblack237/minishop:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: minishop-config
            - secretRef:
                name: minishop-secrets
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
