# TEMPLATE ONLY. Do not put real values in a file that is committed.
# Create the real secret from your terminal instead (see k8s/README.md):
#   kubectl -n minishop create secret generic minishop-secrets \
#     --from-literal=DATABASE_URL='jdbc:postgresql://HOST:5432/minishop?sslmode=require' ...
apiVersion: v1
kind: Secret
metadata:
  name: minishop-secrets
  namespace: minishop
type: Opaque
stringData:
  DATABASE_URL: "jdbc:postgresql://HOST:5432/minishop?sslmode=require"
  DATABASE_USER: "REPLACE_ME"
  DATABASE_PASSWORD: "REPLACE_ME"
  REDIS_URL: "rediss://default:REPLACE_ME@HOST:6379"
  KAFKA_BOOTSTRAP_SERVERS: "HOST:9092"
  KAFKA_SASL_USER: "REPLACE_ME"
  KAFKA_SASL_PASSWORD: "REPLACE_ME"
  JWT_SIGNING_KEY: "REPLACE_ME_WITH_AT_LEAST_32_RANDOM_CHARACTERS"
