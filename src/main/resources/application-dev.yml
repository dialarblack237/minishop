# Dev profile — runs on YOUR laptop.
# Safe to commit: nothing here is a real secret.
spring:
  datasource:
    url: jdbc:h2:mem:minishop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop   # H2 in-memory: schema is created fresh each run
    show-sql: true            # helpful while learning
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: minishop-local
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": "com.example.minishop.*"
  data:
    redis:
      url: redis://localhost:6379

logging:
  level:
    root: INFO
    "[com.example.minishop]": DEBUG