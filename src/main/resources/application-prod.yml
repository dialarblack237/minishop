# Prod profile — runs on Render.
# EVERY value is an env var set in the Render dashboard.
# Never write a real secret here. If it appears in the repo,
# it is compromised.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; never auto-create in prod
    show-sql: false        # never log SQL with parameters in prod
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      "[security.protocol]": SASL_SSL
      "[sasl.mechanism]": SCRAM-SHA-256
      "[sasl.jaas.config]": >
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_SASL_USER}"
        password="${KAFKA_SASL_PASSWORD}";
      "[ssl.truststore.location]": classpath:ca.pem
      "[ssl.truststore.type]": PEM
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: minishop-prod
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": "com.example.minishop.*"
  data:
    redis:
      url: ${REDIS_URL}

management:
  endpoint:
    health:
      show-details: never   # prod: do not leak component status details

server:
  port: ${PORT:8080}

# ── Application properties ──────────────────────────────────
# These were present in application-dev.yml and application-test.yml
# but missing in application-prod.yml. All five are required — the app
# failed on the first unresolved one (app.jwt.secret) and would have
# failed on the next four in sequence. Values that are secrets come
# from env vars; the rest are prod-specific literals.
app:
  payments:
    simulator:
      mode: approve
      slow-seconds: 0        # prod: no artificial delay; simulator returns immediately
  jwt:
    secret: ${JWT_SIGNING_KEY}
    access-ttl-minutes: 15
    refresh-ttl-days: 30