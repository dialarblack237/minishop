openapi: 3.0.3
info:
  title: MiniShop API
  version: 1.0.0
  description: |
    MiniShop's HTTP contract. This file is the PROMISE — what the API
    says it will do. It is hand-written, human-reviewed, and versioned
    with the frontend that consumes it. Any field in a response that is
    not named here is allowed (superset); any field named here must be
    present in the response (subset).

    Order placement is asynchronous: `POST /orders` returns 202 Accepted
    with the created order in state `CREATED`; the state machine moves it
    forward via Kafka. Clients poll `GET /orders/{id}` (once implemented)
    or listen on their own side to observe state transitions.
  contact:
    name: MiniShop
    url: https://github.com/dialarblack237/minishop
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://minishop.onrender.com
    description: Production (Render)

tags:
  - name: Auth
    description: Login, refresh, logout.
  - name: Products
    description: Read and (for ADMIN) manage products; reads are cached.
  - name: Orders
    description: Place orders; read own orders.
  - name: Admin - DLQ
    description: Inspect and replay dead-lettered messages.

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive an access + refresh token pair.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a valid refresh token for a new access + refresh pair.
      description: The old refresh token is revoked as part of rotation.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Refresh token invalid, expired, or revoked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the whole refresh-token family.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out.
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /products:
    get:
      tags: [Products]
      summary: List products, paginated.
      operationId: list
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageProductDto'
        '400':
          description: Unknown sort field (whitelist enforced in 9.2.2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags: [Products]
      summary: Create a product. Requires ADMIN.
      operationId: create
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Requires ADMIN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /products/{id}:
    get:
      tags: [Products]
      summary: Read one product by id.
      operationId: get
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Product found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '404':
          description: Product not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [Products]
      summary: Update a product. Requires ADMIN.
      operationId: update
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '204':
          description: Product updated.
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Requires ADMIN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Product not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /orders:
    post:
      tags: [Orders]
      summary: Place an order. Asynchronous.
      description: |
        Validates the cart, snapshots prices, and returns 202 Accepted with
        the created order in state CREATED. Requires an Idempotency-Key
        header; a duplicate key replays the original response with 200.
        The pipeline (inventory, payment, state transitions) runs
        asynchronously; clients observe state changes via GET /orders/{id}
        once that endpoint exists.
      operationId: placeOrder
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Duplicate idempotency key — original response replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '202':
          description: Order accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '400':
          description: Validation failed or missing Idempotency-Key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Product not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Insufficient stock.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /admin/dlq/{id}/replay:
    post:
      tags: [Admin - DLQ]
      summary: Replay a DLQ message. Requires ADMIN.
      description: |
        Re-publishes the message to its original topic with the original
        eventId. If the event was already processed (dedupe), the replay is
        a no-op. If it failed before, the retry does the work.
      operationId: replay
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '202':
          description: Replay accepted — message re-published to its original topic.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Requires ADMIN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: DLQ message not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Message already replayed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: |
        Sort field(s) in the form `field,direction`. Only these fields are
        allowed: name, priceCents, createdAt, stock. Unknown fields return
        400 (whitelist enforced in 9.2.2).
      schema:
        type: array
        items:
          type: string

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
        deviceId:
          type: string
          nullable: true

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1

    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, accessExpiresInSeconds]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        accessExpiresInSeconds:
          type: integer
          format: int64

    ProductRequest:
      type: object
      required: [name, priceCents, stock]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        priceCents:
          type: integer
          format: int32
          minimum: 0
        stock:
          type: integer
          format: int32
          minimum: 0

    ProductDto:
      type: object
      required: [id, name, priceCents, stock, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        priceCents:
          type: integer
          format: int32
        stock:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'

    OrderLine:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          minimum: 1

    OrderDto:
      type: object
      required: [id, customerId, state, totalCents, createdAt, items]
      properties:
        id:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        state:
          type: string
          enum: [CREATED, RESERVED, PAID, CONFIRMED, CANCELLED, REFUNDED]
        totalCents:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDto'

    OrderItemDto:
      type: object
      required: [productId, quantity, unitPriceCents]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        unitPriceCents:
          type: integer
          format: int32

    PageProductDto:
      type: object
      required: [content, number, size, totalElements, totalPages, first, last, empty]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductDto'
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean

    ProblemDetail:
      type: object
      description: RFC 7807 problem-detail envelope (ErrorHandler).
      required: [type, title, status, detail, traceId]
      properties:
        type:
          type: string
          format: uri
          example: https://minishop.example/errors/400
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
        instance:
          type: string
          format: uri
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string