spring:
  datasource:
    url: jdbc:h2:mem:minishop-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: minishop-test
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
      auto-startup: false

  data:
    redis:
      url: redis://localhost:6379/15

logging:
  level:
    root: INFO
    "[com.example.minishop]": DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  payments:
    simulator:
      mode: approve
      slow-seconds: 0
  jwt:
    secret: test-only-secret-please-replace-with-32-plus-chars-abcdef
    access-ttl-minutes: 15
    refresh-ttl-days: 30