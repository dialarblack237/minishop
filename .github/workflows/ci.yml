name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw -B -DskipTests compile

      - name: Test
        run: ./mvnw -B test

      - name: Coverage gate
        run: ./mvnw -B verify -DskipTests=false

      - name: Package
        run: ./mvnw -B -DskipTests package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: minishop-jar
          path: target/minishop-*.jar
          retention-days: 14